<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Bill Tracker</title>
    <link
      rel="icon"
      href="{{ url_for('static', filename='logo.png') }}"
      type="image/png"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='finance.css') }}"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="head">
      <div class="namediv">
        <h4 class="heading">FINANCE&nbsp;</h4>
        <h4 class="heading webname">TRACKER</h4>
      </div>
      <form action="/landing" method="get" class="nav-brand">
        <button class="home-btn">Home</button>
      </form>
      <button class="theme-btn" id="theme-toggle-btn">🌙</button>
    </header>

    <div class="container">
      <section class="side-panel" aria-label="Add New Transaction Panel">
        <h2>Add New Transaction</h2>
        <form id="transaction-form" action="/addexpense" method="post">
          <label for="trans-date">Date</label>
          <input type="date" id="trans-date" name="trans-date" required />

          <label for="trans-desc">Description</label>
          <input
            type="text"
            id="trans-desc"
            name="trans-desc"
            placeholder="Enter description"
            required
            autofocus
          />

          <label for="trans-amount">Amount</label>
          <input
            type="number"
            id="trans-amount"
            name="trans-amount"
            min="0"
            step="0.01"
            placeholder="0.00"
            required
          />

          <button type="submit">Add Transaction</button>
        </form>
      </section>
      <main class="main-content" aria-label="Bills Section">
        <h1>BILLS</h1>

        <div class="total-expenses" aria-live="polite">
          Total Expenses {{total}}
        </div>

        <table>
          <thead>
            <tr>
              <th>date</th>
              <th>description</th>
              <th>amount</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="bills-table-body">
            {% for expense in expenses %}
            <tr>
              <td>{{ expense.date }}</td>
              <td>{{ expense.description }}</td>
              <td>{{ expense.amount }}</td>
              <td>
                <form action="/delexrow" method="post">
                  <input
                    type="hidden"
                    name="row_id"
                    value="{{ expense._id }}"
                  />
                  <button type="submit" class="delete">delete</button>
                </form>
              </td>
            </tr>
            {% endfor %}
          </tbody>
        </table>
      </main>
    </div>

    <script>
      const body = document.body;
      const themeBtn = document.getElementById("theme-toggle-btn");

      function setTheme(dark) {
        if (dark) {
          body.classList.add("dark");
          themeBtn.innerHTML = "☀️";
          localStorage.setItem("theme", "dark");
        } else {
          body.classList.remove("dark");
          themeBtn.innerHTML = "🌙";
          localStorage.setItem("theme", "light");
        }
      }

      themeBtn.addEventListener("click", () => {
        setTheme(!body.classList.contains("dark"));
      });

      window.addEventListener("load", () => {
        const savedTheme = localStorage.getItem("theme") || "light";
        setTheme(savedTheme === "dark");
      });
    </script>
  </body>
</html>
