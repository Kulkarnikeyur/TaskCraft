<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Password Manager</title>
    <link
      rel="icon"
      href="{{ url_for('static', filename='logo.png') }}"
      type="image/png"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://fonts.googleapis.com/css?family=Montserrat:700,900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Roboto:400,500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='password.css') }}"
    />
  </head>
  <body>
    <!-- Top Bar -->
    <header class="topbar">
      <div class="namediv">
        <h1 class="site-title">PASSWORD&nbsp;</h1>
        <h1 class="site-title webname">MANAGER</h1>
      </div>
      <form action="/landing" method="get">
        <button class="home-btn">Home</button>
      </form>
    </header>

    <main>
      <div class="main-top">
        <h2 class="main-heading">STORE YOUR LOGINS</h2>
        <button class="theme-btn" id="theme-toggle-btn">
          <span class="theme-btn-dark">🌙</span>
        </button>
      </div>
      <div class="layout-row">
        <!-- Left Form -->
        <form
          class="login-form"
          aria-label="Add Login"
          action="/addpassword"
          method="post"
        >
          <label for="website">Website</label>
          <input
            type="text"
            id="website"
            name="website"
            placeholder="Enter website"
            required
            autofocus
          />

          <label for="loginid">login id</label>
          <input
            type="text"
            id="loginid"
            name="loginid"
            placeholder="Enter login id"
            required
          />

          <label for="password">password</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter password"
            required
          />

          <button class="store-btn" type="submit">STORE PASSWORD</button>
        </form>

        <!-- Right Table -->
        <section class="login-table-section" aria-label="Saved Logins">
          <table class="login-table">
            <thead>
              <tr>
                <th>WEBSITE</th>
                <th>LOGIN ID</th>
                <th>PASSWORD</th>
                <th></th>
              </tr>
            </thead>
            <tbody>
              {% for password in passwords %}
              <tr>
                <td>{{ password.website_name }}</td>
                <td>{{ password.login_id }}</td>
                <td>{{ password.password }}</td>
                <td>
                  <form action="/delpasrow" method="post">
                    <input
                      type="hidden"
                      name="row_id"
                      value="{{ password._id }}"
                    />
                    <button type="submit" class="delete">delete</button>
                  </form>
                </td>
              </tr>
              {% endfor %}
            </tbody>
          </table>
        </section>
      </div>
    </main>

    <script>
      const btn = document.getElementById("theme-toggle-btn");
      const body = document.body;

      function applyTheme(dark) {
        if (dark) {
          body.classList.add("dark");
          btn.classList.add("active");
          btn.innerHTML = "☀️";
          btn.localStorage.setItem("theme", "dark");
        } else {
          body.classList.remove("dark");
          btn.classList.remove("active");
          btn.innerHTML = "🌙";
          localStorage.setItem("theme", "light");
        }
      }

      btn.addEventListener("click", () => {
        applyTheme(!body.classList.contains("dark"));
      });

      window.onload = function () {
        const saved = localStorage.getItem("theme");
        applyTheme(saved === "dark");
      };
    </script>
  </body>
</html>
